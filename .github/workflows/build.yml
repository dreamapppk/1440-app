name: Build 1440 APK and AAB

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17 for Android
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build 1440 Native App with Lockscreen Guard & Custom Logo
        run: |
          sudo apt-get update && sudo apt-get install -y librsvg2-bin
          mkdir -p www
          cp index.html www/index.html
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "1440" "com.daily1440.app" --web-dir www
          npx cap add android

          # 1. Generate Attractive High-Contrast Obsidian & Gold 1440 App Icon
          cat << 'EOF' > icon.svg
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
            <defs>
              <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#141824"/>
                <stop offset="100%" stop-color="#050608"/>
              </linearGradient>
              <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#FDE047"/>
                <stop offset="50%" stop-color="#F59E0B"/>
                <stop offset="100%" stop-color="#D97706"/>
              </linearGradient>
            </defs>
            <rect width="512" height="512" rx="115" fill="url(#bg)"/>
            <rect x="18" y="18" width="476" height="476" rx="98" fill="none" stroke="url(#gold)" stroke-width="8" stroke-opacity="0.45"/>
            <circle cx="256" cy="256" r="192" fill="none" stroke="#1E2330" stroke-width="24"/>
            <circle cx="256" cy="256" r="192" fill="none" stroke="url(#gold)" stroke-width="24" stroke-linecap="round" stroke-dasharray="940 1206" transform="rotate(-90 256 256)"/>
            <polygon points="216,120 296,120 256,162" fill="url(#gold)"/>
            <polygon points="256,162 296,204 216,204" fill="url(#gold)" opacity="0.85"/>
            <text x="256" y="295" text-anchor="middle" fill="#FFFFFF" font-family="monospace, sans-serif" font-weight="900" font-size="118" letter-spacing="-4">1440</text>
            <text x="256" y="352" text-anchor="middle" fill="#FBBF24" font-family="sans-serif" font-weight="800" font-size="26" letter-spacing="6">MINUTE BANK</text>
          </svg>
          EOF

          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for dir in mipmap-mdpi:48 mipmap-hdpi:72 mipmap-xhdpi:96 mipmap-xxhdpi:144 mipmap-xxxhdpi:192; do
            folder="${dir%%:*}"
            size="${dir##*:}"
            rsvg-convert -w "$size" -h "$size" icon.svg -o "android/app/src/main/res/$folder/ic_launcher.png"
            rsvg-convert -w "$size" -h "$size" icon.svg -o "android/app/src/main/res/$folder/ic_launcher_round.png"
            rsvg-convert -w "$size" -h "$size" icon.svg -o "android/app/src/main/res/$folder/ic_launcher_foreground.png"
          done

          # 2. Create Native Persistent Lockscreen & Status Bar Service (MinuteGuardService.java)
          cat << 'EOF' > android/app/src/main/java/com/daily1440/app/MinuteGuardService.java
          package com.daily1440.app;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.ServiceInfo;
          import android.os.Build;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;
          import java.util.Calendar;

          public class MinuteGuardService extends Service {
              private static final String CHANNEL_ID = "1440_live_vault_channel";
              private static final int NOTIF_ID = 1440;
              private Handler handler;
              private Runnable ticker;

              @Override
              public void onCreate() {
                  super.onCreate();
                  createChannel();
                  handler = new Handler(Looper.getMainLooper());
                  ticker = new Runnable() {
                      @Override
                      public void run() {
                          updateVaultNotification();
                          handler.postDelayed(this, 15000);
                      }
                  };
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  Notification notification = buildVaultNotification();
                  try {
                      if (Build.VERSION.SDK_INT >= 34) {
                          startForeground(NOTIF_ID, notification, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE);
                      } else {
                          startForeground(NOTIF_ID, notification);
                      }
                  } catch (Exception e) {}
                  handler.removeCallbacks(ticker);
                  handler.post(ticker);
                  return START_STICKY;
              }

              private void updateVaultNotification() {
                  try {
                      NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                      if (nm != null) {
                          nm.notify(NOTIF_ID, buildVaultNotification());
                      }
                  } catch (Exception e) {}
              }

              private Notification buildVaultNotification() {
                  Calendar cal = Calendar.getInstance();
                  int elapsed = (cal.get(Calendar.HOUR_OF_DAY) * 60) + cal.get(Calendar.MINUTE);
                  int remaining = Math.max(0, 1440 - elapsed);
                  int pct = (int) Math.round((remaining / 1440.0) * 100);

                  SharedPreferences prefs = getSharedPreferences("1440_native_prefs", MODE_PRIVATE);
                  int invested = prefs.getInt("invested", 0);
                  String goal = prefs.getString("goal", "Invest your next minute wisely!");

                  Intent openIntent = new Intent(this, MainActivity.class);
                  openIntent.setFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                  int piFlags = PendingIntent.FLAG_UPDATE_CURRENT;
                  if (Build.VERSION.SDK_INT >= 23) piFlags |= PendingIntent.FLAG_IMMUTABLE;
                  PendingIntent pendingIntent = PendingIntent.getActivity(this, 0, openIntent, piFlags);

                  Notification.Builder builder;
                  if (Build.VERSION.SDK_INT >= 26) {
                      builder = new Notification.Builder(this, CHANNEL_ID);
                  } else {
                      builder = new Notification.Builder(this);
                  }

                  builder.setContentTitle("⏳ " + remaining + " Mins Left Today (" + pct + "% Left)")
                         .setContentText("Invested: " + invested + "m • " + goal)
                         .setSmallIcon(getApplicationInfo().icon)
                         .setContentIntent(pendingIntent)
                         .setOngoing(true)
                         .setOnlyAlertOnce(true)
                         .setProgress(1440, remaining, false);

                  if (Build.VERSION.SDK_INT >= 21) {
                      builder.setVisibility(Notification.VISIBILITY_PUBLIC);
                      builder.setColor(0xFFF59E0B);
                      builder.setCategory(Notification.CATEGORY_PROGRESS);
                  }
                  if (Build.VERSION.SDK_INT >= 26) {
                      builder.setColorized(true);
                  }
                  if (Build.VERSION.SDK_INT >= 31) {
                      builder.setForegroundServiceBehavior(Notification.FOREGROUND_SERVICE_IMMEDIATE);
                  }

                  return builder.build();
              }

              private void createChannel() {
                  if (Build.VERSION.SDK_INT >= 26) {
                      NotificationChannel channel = new NotificationChannel(
                          CHANNEL_ID,
                          "1440 Live Minute Countdown",
                          NotificationManager.IMPORTANCE_LOW
                      );
                      channel.setDescription("Shows your remaining daily minutes on the lockscreen and status bar");
                      channel.setLockscreenVisibility(Notification.VISIBILITY_PUBLIC);
                      channel.setShowBadge(false);
                      NotificationManager nm = getSystemService(NotificationManager.class);
                      if (nm != null) nm.createNotificationChannel(channel);
                  }
              }

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }
          }
          EOF

          # 3. Update MainActivity.java to Start Service & Sync with JS
          cat << 'EOF' > android/app/src/main/java/com/daily1440/app/MainActivity.java
          package com.daily1440.app;

          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.webkit.JavascriptInterface;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  requestNotifPermissionAndStart();
                  try {
                      if (this.bridge != null && this.bridge.getWebView() != null) {
                          this.bridge.getWebView().addJavascriptInterface(new WebAppBridge(), "Android1440");
                      }
                  } catch (Exception e) {}
              }

              @Override
              public void onResume() {
                  super.onResume();
                  startMinuteGuard();
              }

              private void requestNotifPermissionAndStart() {
                  if (Build.VERSION.SDK_INT >= 33) {
                      if (checkSelfPermission("android.permission.POST_NOTIFICATIONS") != PackageManager.PERMISSION_GRANTED) {
                          requestPermissions(new String[]{"android.permission.POST_NOTIFICATIONS"}, 1440);
                          return;
                      }
                  }
                  startMinuteGuard();
              }

              @Override
              public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  startMinuteGuard();
              }

              private void startMinuteGuard() {
                  try {
                      Intent serviceIntent = new Intent(this, MinuteGuardService.class);
                      if (Build.VERSION.SDK_INT >= 26) {
                          startForegroundService(serviceIntent);
                      } else {
                          startService(serviceIntent);
                      }
                  } catch (Exception e) {}
              }

              public class WebAppBridge {
                  @JavascriptInterface
                  public void syncState(int invested, String activeGoal) {
                      SharedPreferences prefs = getSharedPreferences("1440_native_prefs", MODE_PRIVATE);
                      prefs.edit()
                           .putInt("invested", invested)
                           .putString("goal", activeGoal != null ? activeGoal : "Stay focused on your goal!")
                           .apply();
                      startMinuteGuard();
                  }
              }
          }
          EOF

          # 4. Inject Permissions & Service into AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />\n    <application|g' android/app/src/main/AndroidManifest.xml
          sed -i 's|</application>|    <service android:name=".MinuteGuardService" android:enabled="true" android:exported="false" android:foregroundServiceType="specialUse"><property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE" android:value="live_daily_1440_minute_countdown" /></service>\n    </application>|g' android/app/src/main/AndroidManifest.xml

          # 5. Compile Debug APK & Release AAB
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease

      - name: Upload Ready APK (For Phone Testing)
        uses: actions/upload-artifact@v4
        with:
          name: 1440-Offline-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Ready AAB (For Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: 1440-PlayStore-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
