name: Build 1440 APK and AAB

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17 for Android
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Pack 100% Offline App & Build Android
        run: |
          mkdir -p www
          cp index.html www/index.html
          curl -sL https://cdn.tailwindcss.com -o www/tailwind.js
          sed -i 's|https://cdn.tailwindcss.com|tailwind.js|g' www/index.html
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "1440" "com.daily1440.app" --web-dir www
          npx cap add android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease

      - name: Upload Ready APK (For Phone Testing)
        uses: actions/upload-artifact@v4
        with:
          name: 1440-Offline-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Ready AAB (For Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: 1440-PlayStore-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          
